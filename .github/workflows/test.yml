name: "Test"

on:
  push:
    branches:
      - main

jobs:
  test:
    name: "Test Sqrt Functionality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python --version
      - run: python -m pip install -r requirements.txt
      - run: pytest -v --cov
